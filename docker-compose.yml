services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiptrack}
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/server/uploads
      PUBLIC_URL: http://localhost:${API_PORT:-5000}
    volumes: [uploads:/app/server/uploads]
    # API_PORT=5055 docker compose up  — if something else already uses port 5000
    ports: ["${API_PORT:-5000}:5000"]
    depends_on: [mongo, ai-service]

  ai-service:
    build: ./ai-service
    env_file: ./ai-service/.env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/shiptrack}
      NODE_API_URL: http://server:5000
      MODEL_PATH: /srv/models/model.pkl
    volumes: [ai-models:/srv/models]
    ports: ["8000:8000"]
    depends_on: [mongo]

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-5000}
      VITE_SOCKET_URL: http://localhost:${API_PORT:-5000}
    ports: ["5173:5173"]
    depends_on: [server]

volumes:
  mongo-data:
  uploads:
  ai-models:
  client-node-modules:
