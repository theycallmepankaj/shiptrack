<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShipTrack — book a courier in a minute and follow your parcel live on the map until it's at the door." />
    <meta name="theme-color" content="#0B1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShipTrack — Live courier tracking</title>
    <script>
      // Apply theme before paint to avoid a flash (system setting by default).
      try {
        const t = localStorage.getItem('theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
