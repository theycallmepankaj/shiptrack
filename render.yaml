# Render Blueprint: the Node API and the Python AI service (Dashboard → Blueprints → New).
# MongoDB lives on Atlas and the client on Vercel — see README › Deploy.
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: shiptrack-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI # Atlas connection string, database "shiptrack"
        sync: false
      - key: CLIENT_URL # the Vercel URL, e.g. https://shiptrack.vercel.app (comma-separate several)
        sync: false
      - key: PUBLIC_URL # this service's URL, e.g. https://shiptrack-api.onrender.com
        sync: false
      - key: AI_SERVICE_URL # e.g. https://shiptrack-ai.onrender.com
        sync: false
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: shiptrack-ai
          envVarKey: INTERNAL_API_KEY
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: TRUST_PROXY # Render's proxy + Vercel's /api rewrite
        value: "2"
      - key: RAZORPAY_KEY_ID # test-mode keys
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_URL # proof photos, signatures and policy documents (Render's disk is wiped on deploy)
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: ShipTrack <no-reply@shiptrack.dev>
      - key: SEED_DEMO # demo accounts + sample data on first start; set "false" for a real launch
        value: "true"

  - type: web
    name: shiptrack-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    region: singapore
    # Measured peak (model training + document indexing + chat): ~370 MB, so the free plan's 512 MB fits.
    # Free instances sleep after 15 idle minutes; the API falls back to its own ETA/routing meanwhile.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: NODE_API_URL # the API's URL, e.g. https://shiptrack-api.onrender.com
        sync: false
      - key: LLM_API_KEY # Claude API key; without it the bot quotes the policy text
        sync: false
      - key: VECTOR_SEARCH # after running python -m app.rag.setup_index against Atlas
        value: atlas
